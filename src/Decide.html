<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { margin: 0; background: #f6f4f0; color: #22201c; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px; }
  .card { background: #fff; border: 1px solid #e4dfd7; border-radius: 14px; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .label { color: #77716a; font-size: 13px; }
  p { margin: 6px 0 12px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 70px; padding: 10px; border: 1px solid #e4dfd7; border-radius: 8px; font: inherit; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 11px 20px; cursor: pointer; border: 1px solid #e4dfd7; background: #fff; }
  .accept { background: #2f7a4f; border-color: #2f7a4f; color: #fff; }
  .decline { color: #b3412f; border-color: #b3412f; }
  button:disabled { opacity: .5; cursor: default; }
  .result { font-weight: 600; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"><p>Loading…</p></div></div>
<script>
(function () {
  var ID = <?!= JSON.stringify(reqId) ?>, TOKEN = <?!= JSON.stringify(reqToken) ?>;
  var card = document.getElementById('card');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  google.script.run.withSuccessHandler(function (r) {
    if (!r.found) { card.innerHTML = '<h1>Nothing to answer</h1><p>This request has already been answered or no longer exists.</p>'; return; }
    card.innerHTML =
      '<h1>Booking request</h1>' +
      '<p><span class="label">Who</span><br>' + esc(r.name) + ' (' + esc(r.email) + ')</p>' +
      '<p><span class="label">When</span><br>' + esc(r.when) + '</p>' +
      (r.note ? '<p><span class="label">Note</span><br>' + esc(r.note).replace(/\n/g, '<br>') + '</p>' : '') +
      '<p><span class="label">Message to them if you decline (optional)</span></p>' +
      '<textarea id="msg" placeholder="e.g. Could we try the following week?"></textarea>' +
      '<div class="actions"><button class="accept" id="yes">Accept</button><button class="decline" id="no">Decline</button></div>' +
      '<div class="result" id="result"></div>';
    document.getElementById('yes').onclick = function () { go('accept'); };
    document.getElementById('no').onclick = function () { go('decline'); };
  }).withFailureHandler(function () {
    card.innerHTML = '<p>Something went wrong loading this request.</p>';
  }).getRequest(ID, TOKEN);

  function go(action) {
    document.getElementById('yes').disabled = true;
    document.getElementById('no').disabled = true;
    document.getElementById('result').textContent = action === 'accept' ? 'Accepting…' : 'Declining…';
    google.script.run.withSuccessHandler(function (r) {
      document.getElementById('result').textContent = r.text;
    }).withFailureHandler(function (e) {
      document.getElementById('result').textContent = 'Something went wrong: ' + ((e && e.message) || e);
      document.getElementById('yes').disabled = false;
      document.getElementById('no').disabled = false;
    }).decide(ID, TOKEN, action, (document.getElementById('msg') || {}).value || '');
  }
})();
</script>
</body>
</html>
